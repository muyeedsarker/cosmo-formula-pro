name: Deploy Cosmo Formula Pro to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract website
        run: |
          rm -rf site extracted
          mkdir -p site
          unzip -q cosmo-formula-pro-redesigned.zip -d extracted
          cp -R extracted/cosmo-formula-pro/. site/
          test -f site/index.html

      - name: Add Formula Libraries
        run: |
          cp soap.html site/soap.html
          cp shampoo.html site/shampoo.html
          cp cream.html site/cream.html
          cp lotion.html site/lotion.html
          cp facewash.html site/facewash.html
          cp hair-oil.html site/hair-oil.html
          cp serum.html site/serum.html
          cp body-wash.html site/body-wash.html
          cp scrub.html site/scrub.html
          cp toner.html site/toner.html
          cp hair-pack.html site/hair-pack.html
          cp toilet-cleaner.html site/toilet-cleaner.html
          cp glass-cleaner.html site/glass-cleaner.html
          cp floor-cleaner.html site/floor-cleaner.html
          cp dishwash.html site/dishwash.html
          cp liquid-handwash.html site/liquid-handwash.html
          cp laundry-detergent.html site/laundry-detergent.html
          cp liquid-laundry-detergent.html site/liquid-laundry-detergent.html
          cp fabric-softener.html site/fabric-softener.html
          cp glass-surface-polish.html site/glass-surface-polish.html
          cp dishwasher-liquid.html site/dishwasher-liquid.html
          cp car-shampoo.html site/car-shampoo.html
          cp car-interior-cleaner.html site/car-interior-cleaner.html
          cp car-tire-wheel-cleaner.html site/car-tire-wheel-cleaner.html
          cp car-glass-windshield-cleaner.html site/car-glass-windshield-cleaner.html
          cp car-polish-wax.html site/car-polish-wax.html
          cp car-air-freshener.html site/car-air-freshener.html
          cp car-engine-degreaser.html site/car-engine-degreaser.html
          cp car-upholstery-fabric-cleaner.html site/car-upholstery-fabric-cleaner.html
          cp car-leather-cleaner-conditioner.html site/car-leather-cleaner-conditioner.html
          cp car-metal-chrome-polish.html site/car-metal-chrome-polish.html
          cp car-odor-eliminator.html site/car-odor-eliminator.html
          cp car-plastic-vinyl-cleaner.html site/car-plastic-vinyl-cleaner.html
          cp car-ac-interior-cleaner.html site/car-ac-interior-cleaner.html
          cp car-dashboard-polish-dressing.html site/car-dashboard-polish-dressing.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path("site/index.html")
          s=p.read_text(encoding="utf-8")
          css='''<style>.formula-library-button{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:999px;color:#fff!important;text-decoration:none;font-weight:700;box-shadow:0 5px 18px #0002;margin:6px;background:linear-gradient(135deg,#7c3aed,#db2777)}.formula-library-button.shampoo{background:linear-gradient(135deg,#0f766e,#2563eb)}.formula-library-button.cream{background:linear-gradient(135deg,#be185d,#7c3aed)}.formula-library-button.lotion{background:linear-gradient(135deg,#047857,#0891b2)}.formula-library-button.facewash{background:linear-gradient(135deg,#0369a1,#4f46e5)}.formula-library-button.hair{background:linear-gradient(135deg,#92400e,#b45309)}.formula-library-button.serum{background:linear-gradient(135deg,#4338ca,#7c3aed)}.formula-library-button.bodywash{background:linear-gradient(135deg,#0f766e,#0891b2)}.formula-library-button.scrub{background:linear-gradient(135deg,#9a3412,#ea580c)}.formula-library-button.toner{background:linear-gradient(135deg,#0e7490,#2563eb)}.formula-library-button.hairpack{background:linear-gradient(135deg,#166534,#65a30d)}.formula-library-button.toilet{background:linear-gradient(135deg,#0f766e,#1d4ed8)}.formula-library-button.glass{background:linear-gradient(135deg,#0284c7,#2563eb)}.formula-library-button.floor{background:linear-gradient(135deg,#166534,#0f766e)}.formula-library-button.dishwash{background:linear-gradient(135deg,#0369a1,#0891b2)}.formula-library-button.handwash{background:linear-gradient(135deg,#0f766e,#0891b2)}.formula-library-button.laundry{background:linear-gradient(135deg,#2563eb,#7c3aed)}.formula-library-button.liquidlaundry{background:linear-gradient(135deg,#0891b2,#2563eb)}.formula-library-button:hover{transform:translateY(-1px)}</style>'''
          if "formula-library-button" not in s:
              s=s.replace("</head>",css+"</head>",1)
          links=[("soap.html","🧼 সাবান ফর্মুলা",""),("shampoo.html","🧴 শ্যাম্পু ফর্মুলা","shampoo"),("cream.html","🧴 ক্রিম ফর্মুলা","cream"),("lotion.html","🧴 লোশন ফর্মুলা","lotion"),("facewash.html","🫧 ফেসওয়াশ ফর্মুলা","facewash"),("hair-oil.html","🌿 হেয়ার অয়েল ফর্মুলা","hair"),("serum.html","✨ সিরাম ফর্মুলা","serum"),("body-wash.html","🫧 বডি ওয়াশ ফর্মুলা","bodywash"),("scrub.html","🧽 স্ক্রাব ফর্মুলা","scrub"),("toner.html","💧 টোনার ফর্মুলা","toner"),("hair-pack.html","🌿 হেয়ার প্যাক ফর্মুলা","hairpack"),("toilet-cleaner.html","🚽 টয়লেট ক্লিনার ফর্মুলা","toilet"),("glass-cleaner.html","🪟 গ্লাস ক্লিনার ফর্মুলা","glass"),("floor-cleaner.html","🧹 ফ্লোর ক্লিনার ফর্মুলা","floor"),("dishwash.html","🍽️ ডিশওয়াশ ফর্মুলা","dishwash"),("liquid-handwash.html","🧴 লিকুইড হ্যান্ডওয়াশ ফর্মুলা","handwash"),("laundry-detergent.html","🧺 লন্ড্রি ডিটারজেন্ট ফর্মুলা","laundry"),("liquid-laundry-detergent.html","🧺 লিকুইড লন্ড্রি ডিটারজেন্ট ফর্মুলা","liquidlaundry"),("fabric-softener.html","🧴 ফ্যাব্রিক সফটেনার ফর্মুলা","softener"),("glass-surface-polish.html","✨ গ্লাস/সারফেস পলিশ ফর্মুলা","polish"),("dishwasher-liquid.html","🍽️ ডিশওয়াশার লিকুইড ফর্মুলা","dishwasher"),("car-shampoo.html","🚗 কার শ্যাম্পু ফর্মুলা","carshampoo"),("car-interior-cleaner.html","🚘 কার ড্যাশবোর্ড/ইন্টেরিয়র ক্লিনার","carinterior"),("car-tire-wheel-cleaner.html","🛞 কার টায়ার/হুইল ক্লিনার","cartire"),("car-glass-windshield-cleaner.html","🪟 কার গ্লাস/উইন্ডশিল্ড ক্লিনার","carglass")]
          for href,label,cls in links:
              if href not in s:
                  button=f'<a href="{href}" class="formula-library-button {cls}" aria-label="{label}">{label}</a>'
                  s=s.replace("</body>",button+"</body>",1)
          p.write_text(s,encoding="utf-8")
          PY
          for f in soap.html shampoo.html cream.html lotion.html facewash.html hair-oil.html serum.html body-wash.html scrub.html toner.html hair-pack.html toilet-cleaner.html glass-cleaner.html floor-cleaner.html dishwash.html liquid-handwash.html laundry-detergent.html liquid-laundry-detergent.html fabric-softener.html glass-surface-polish.html dishwasher-liquid.html car-shampoo.html car-interior-cleaner.html car-tire-wheel-cleaner.html car-glass-windshield-cleaner.html; do test -f "site/$f"; done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
