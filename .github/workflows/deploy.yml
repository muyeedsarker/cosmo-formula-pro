name: Deploy Cosmo Formula Pro to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract website
        run: |
          rm -rf site extracted
          mkdir -p site
          unzip -q cosmo-formula-pro-redesigned.zip -d extracted
          cp -R extracted/cosmo-formula-pro/. site/
          test -f site/index.html

      - name: Add Formula Libraries
        run: |
          cp soap.html site/soap.html
          cp shampoo.html site/shampoo.html
          cp cream.html site/cream.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path("site/index.html")
          s=p.read_text(encoding="utf-8")
          css='''<style>.formula-library-button{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:999px;color:#fff!important;text-decoration:none;font-weight:700;box-shadow:0 5px 18px #0002;margin:6px;background:linear-gradient(135deg,#7c3aed,#db2777)}.formula-library-button.shampoo{background:linear-gradient(135deg,#0f766e,#2563eb)}.formula-library-button.cream{background:linear-gradient(135deg,#be185d,#7c3aed)}.formula-library-button:hover{transform:translateY(-1px)}</style>'''
          if "formula-library-button" not in s:
              s=s.replace("</head>",css+"</head>",1)
          links=[("soap.html","🧼 সাবান ফর্মুলা",""),("shampoo.html","🧴 শ্যাম্পু ফর্মুলা","shampoo"),("cream.html","🧴 ক্রিম ফর্মুলা","cream")]
          for href,label,cls in links:
              if href not in s:
                  button=f'<a href="{href}" class="formula-library-button {cls}" aria-label="{label}">{label}</a>'
                  s=s.replace("</body>",button+"</body>",1)
          p.write_text(s,encoding="utf-8")
          PY
          test -f site/soap.html
          test -f site/shampoo.html
          test -f site/cream.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
