<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Floor Cleaner Formula Library</title><style>body{font-family:system-ui,Arial,sans-serif;margin:0;background:#f4f8f6;color:#17231d}.wrap{max-width:1050px;margin:auto;padding:22px}h1{margin:0 0 8px}.sub{color:#617068}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.bar input,.bar select,.bar button{padding:11px;border:1px solid #ccd8d1;border-radius:9px;background:#fff}.bar input{flex:1;min-width:190px}.bar button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}.card{background:#fff;border:1px solid #dce6e0;border-radius:14px;padding:17px;box-shadow:0 2px 10px #00000008}.card h2{font-size:19px;margin:0 0 7px}.tag{font-size:12px;color:#59675f;margin-bottom:10px}.items{margin:10px 0;padding-left:20px}.items li{margin:5px 0}.actions button{border:0;border-radius:8px;padding:9px 12px;cursor:pointer}.copy{background:#e7f1eb}.reset{background:#f0f0f0}.note{margin-top:20px;padding:14px;border-radius:12px;background:#fff8df;border:1px solid #eadca7;font-size:14px;line-height:1.55}</style></head><body><main class="wrap"><h1>🧹 Floor Cleaner Formula Library</h1><div class="sub">ফ্লোর ক্লিনার — সার্চ, ক্যাটাগরি ও ব্যাচ স্কেলিংসহ</div><div class="bar"><input id="search" placeholder="ফর্মুলা খুঁজুন..."><select id="cat"><option value="">সব ক্যাটাগরি</option></select><label>Batch (L) <input id="batch" type="number" min="0.1" step="0.1" value="1"></label><button onclick="setBatch(1)">1 L</button><button onclick="setBatch(2)">2 L</button><button onclick="setBatch(5)">5 L</button><button onclick="setBatch(10)">10 L</button><button class="reset" onclick="resetAll()">↺ রিসেট</button></div><section id="grid" class="grid"></section><div class="note"><b>নিরাপত্তা:</b> এটি হাউসহোল্ড ক্লিনার ফর্মুলা। ব্লিচ/হাইপোক্লোরাইট, অ্যামোনিয়া, অ্যাসিড বা অন্য ক্লিনার একসাথে মেশাবেন না। ছোট ব্যাচে পরীক্ষা, কাঁচামালের SDS, pH/স্থিতিশীলতা ও প্যাকেজিং যাচাই করে তবেই উৎপাদন করুন।</div></main><script>const formulas=[{name:"Daily Floor Cleaner",cat:"Daily",items:["Nonionic surfactant — 20 g","Solubilizer — 8 g","Chelating agent — 2 g","Fragrance — 3 g","Preservative — 2 g","Water — 965 g"]},{name:"Pine Floor Cleaner",cat:"Pine",items:["Nonionic surfactant — 25 g","Pine fragrance — 5 g","Solubilizer — 8 g","Chelating agent — 2 g","Preservative — 2 g","Water — 958 g"]},{name:"Lemon Floor Cleaner",cat:"Lemon",items:["Nonionic surfactant — 22 g","Lemon fragrance — 4 g","Solubilizer — 8 g","Chelating agent — 2 g","Preservative — 2 g","Water — 962 g"]},{name:"Lavender Floor Cleaner",cat:"Lavender",items:["Nonionic surfactant — 20 g","Lavender fragrance — 4 g","Solubilizer — 8 g","Chelating agent — 2 g","Preservative — 2 g","Water — 964 g"]},{name:"Low-Foam Floor Cleaner",cat:"Low Foam",items:["Low-foam surfactant — 18 g","Solubilizer — 7 g","Chelating agent — 2 g","Fragrance — 2 g","Preservative — 2 g","Water — 969 g"]},{name:"Fresh Herbal Floor Cleaner",cat:"Herbal",items:["Nonionic surfactant — 22 g","Herbal fragrance — 4 g","Solubilizer — 8 g","Chelating agent — 2 g","Preservative — 2 g","Water — 962 g"]}];const grid=document.getElementById("grid"),search=document.getElementById("search"),cat=document.getElementById("cat"),batch=document.getElementById("batch");[...new Set(formulas.map(function(x){return x.cat}))].forEach(function(x){cat.insertAdjacentHTML("beforeend","<option>"+x+"</option>")});function num(s){var m=s.match(/([0-9]+(?:\.[0-9]+)?)\s*g\s*$/i);return m?+m[1]:null}function scaled(s){var n=num(s);return n===null?s:((n*+batch.value).toFixed(2).replace(/\.00$/,""))+" g"}function render(){var q=search.value.trim().toLowerCase(),c=cat.value;var html=formulas.filter(function(f){return(!q||(f.name+" "+f.cat+" "+f.items.join(" ")).toLowerCase().includes(q))&&(!c||f.cat===c)}).map(function(f,i){return "<article class=\"card\"><h2>"+f.name+"</h2><div class=\"tag\">Category: "+f.cat+" · Batch: "+batch.value+" L</div><ul class=\"items\">"+f.items.map(function(x){return "<li>"+scaled(x)+"</li>"}).join("")+"</ul><div class=\"actions\"><button class=\"copy\" onclick=\"copyFormula("+i+")\">📋 ফর্মুলা কপি</button></div></article>"}).join("");grid.innerHTML=html||"<p>কোনো ফর্মুলা পাওয়া যায়নি।</p>"}function copyFormula(i){var f=formulas[i];var t=f.name+"\nBatch: "+batch.value+" L\n"+f.items.map(function(x){return "• "+scaled(x)}).join("\n");navigator.clipboard&&navigator.clipboard.writeText(t);alert("ফর্মুলা কপি হয়েছে।")}function setBatch(v){batch.value=v;render()}function resetAll(){search.value="";cat.value="";batch.value=1;render()}search.oninput=render;cat.onchange=render;batch.oninput=render;render();</script></body></html>
